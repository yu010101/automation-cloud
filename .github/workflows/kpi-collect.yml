name: kpi-collect

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  kpi-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r ../requirements-cloud.txt

      - name: Collect KPIs
        env:
          DB_BACKEND: turso
          TURSO_HUB_URL: ${{ secrets.TURSO_HUB_URL }}
          TURSO_HUB_TOKEN: ${{ secrets.TURSO_HUB_TOKEN }}
          TURSO_EDDIE_URL: ${{ secrets.TURSO_EDDIE_URL }}
          TURSO_EDDIE_TOKEN: ${{ secrets.TURSO_EDDIE_TOKEN }}
          CFO_API_URL: ${{ secrets.CFO_API_URL }}
        run: python -m src.kpi.collector

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ kpi-collect workflow failed" \
            -d parse_mode=Markdown
