name: news-fetch

on:
  schedule:
    - cron: '0 22 * * *'  # 7:00 JST
  workflow_dispatch:

jobs:
  news-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r ../requirements-cloud.txt

      - name: Run news fetch + summarize
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DB_BACKEND: turso
          TURSO_HUB_URL: ${{ secrets.TURSO_HUB_URL }}
          TURSO_HUB_TOKEN: ${{ secrets.TURSO_HUB_TOKEN }}
        run: python -m src.news.pipeline

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ news-fetch workflow failed" \
            -d parse_mode=Markdown
