name: morning-brief

on:
  schedule:
    - cron: '0 23 * * *'  # 8:00 JST
  workflow_dispatch:

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r ../requirements-cloud.txt

      - name: Post morning briefing to Slack
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_BRIEFING: ${{ secrets.SLACK_CHANNEL_BRIEFING }}
          DB_BACKEND: turso
          TURSO_HUB_URL: ${{ secrets.TURSO_HUB_URL }}
          TURSO_HUB_TOKEN: ${{ secrets.TURSO_HUB_TOKEN }}
          TURSO_EDDIE_URL: ${{ secrets.TURSO_EDDIE_URL }}
          TURSO_EDDIE_TOKEN: ${{ secrets.TURSO_EDDIE_TOKEN }}
          CFO_API_URL: ${{ secrets.CFO_API_URL }}
        run: python -m src.hub.briefing --post

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ morning-brief workflow failed" \
            -d parse_mode=Markdown
